# Doku-Referenz-Gate — emittiert von ai-harness-init (Adopter-Baseline).
# Startgeruest: `d-check --print-config`. Waechst mit den Artefakten:
# ids/codepaths erst aktivieren, wenn Targets/roots existieren — sonst
# Config-Fehler bzw. ein behaupteter, aber leerer Gate (Modul 13, LH-QA-01).
scan:
  roots: ["."]
  # .harness/**: tool-interne Ablage (gefetchtes Sprachskelett-Staging, slice-004a) —
  # keine Adopter-Doku, vom Doc-Gate ausgenommen.
  ignore: ["**/*.template.md", ".tmp/**", ".harness/**"]
modules: [links, anchors, ids, matrix, spans]
ids:
  patterns:
    - {regex: 'ADR-\d{4}', target: docs/plan/adr/, link-policy: always}
    # Requirement-Praefix gehoert dem Adopter (er ist in einem frischen Ziel nicht
    # bekannt) — Muster setzen und aktivieren, sobald spec/lastenheft.md eigene
    # Kennungen fuehrt: {regex: '<PREFIX>-[A-Z]{2}-\d{2}', target: spec/lastenheft.md, link-policy: always}
# codepaths bleibt aus: im frischen Ziel fehlt docs/plan/planning/observations/README.md
# (das Register entsteht erst mit der ersten Beobachtung), und drei mitemittierte
# Workflow-Commands nennen den Ort per Inline-Code — aktivieren, sobald dieser Ort
# emittiert wird oder die Commands ihn anders referenzieren.
# codepaths:
#   roots: [spec, docs, harness]
# Herkunft der Positionen in diesem Block, gemessen gegen die Baseline-Vorlage
# (.harness/baseline/<tag>/templates/.d-check.yml). order:/direction: auf
# spec-straten, token: 'slice-\d{3}' auf der slice-Klasse und die Regel
# {from: adr, to: slice} stehen dort im auskommentierten matrix-Block und
# gehen mit. Zwei Positionen gehen darueber hinaus: die welle-Klasse samt
# token: 'welle-\d{2}' und die Regel {from: adr, to: welle} decken ein
# drittes Lifecycle-Artefakt neben adr und slice, das die Vorlage noch nicht
# fuehrt; exclude-sections traegt dafuer nur Geschichte, nicht Historie/
# "7. Historie": Die ADR-Vorlage fuehrt in ihrem Geschichte-Abschnitt eine
# Verweis-Spalte, deren erste Zeile eine Slice-Datei nennt — legitime
# rueckwaertige Provenance, die {from: adr, to: slice} sonst faelschlich
# faengt. Die Historie-Abschnitte der Spec-Straten-Vorlagen tragen keine
# solche Ausnahme: ihre eigene Decken-Regel verbietet dort jeden ADR-/
# Slice-Verweis ebenso wie ausserhalb der Historie, die Spalte "Verweis"
# fuehrt nur den externen Change Request.
# Eine Position bleibt bewusst hinter der Vorlage zurueck:
# token: 'ADR-\d{4}' auf der adr-Klasse geht NICHT mit — das
# ids-Modul deckt die blosse Kennung bereits ueber link-policy: always ab
# (id-unlinked), ein zweiter Fang ueber matrix waere redundant; fuer slice
# gibt es keine solche ids-Regel, darum bleibt dessen token: aktiv.
matrix:
  classes:
    - {name: spec-straten, paths: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md], order: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md], direction: no-downward}
    - {name: adr, paths: ["docs/plan/adr/[0-9]*.md"]}
    - {name: slice, paths: ["docs/plan/planning/**/slice-*.md"], token: 'slice-\d{3}'}
    - {name: welle, paths: ["docs/plan/planning/**/welle-*.md"], token: 'welle-\d{2}'}
  rules:
    - {from: spec-straten, to: adr, allow: false}
    - {from: spec-straten, to: slice, allow: false}
    # Eine Accepted-ADR nennt eine Slice-/Welle-Kennung nur als deklarierte Provenance
    # (Baseline-Regelwerk grundlagen-referenz-richtung.md §Referenz-Richtung): der
    # Zeilen-Marker <!-- d-check:status-provenance --> nimmt die Zeile aus. Er ist der
    # vorgesehene Ausweg.
    - {from: adr, to: slice, allow: false}
    - {from: adr, to: welle, allow: false}
  status: {forbidden: [superseded, deprecated]}
  exclude-sections: [Geschichte]
