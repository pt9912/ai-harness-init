# Release — Plattform-Matrix bauen, auf jeder Plattform starten, ans Release haengen
# (slice-048, LH-QA-04).
#
# DRITTE Sensor-Klasse neben ci.yml (hermetisch pro Push) und upstream-drift.yml
# (Netz, naechtlich): tag-getrieben. MR-014 Setzung 2 trennt nach Klasse, nicht nach
# Runner-Typ — deshalb liegt der Plattform-Nachweis HIER und nicht in ci.yml: die
# Artefakte, die er prueft, entstehen in diesem Lauf. So gibt es keinen zweiten Build
# und kein Weiterreichen zwischen Workflows.
#
# MR-014 Setzung 1 lautet: die Steps rufen AUSSCHLIESSLICH `make <target>`, damit ein
# Check nur EINE Quelle hat. Hier gilt sie so: der Bau steckt vollstaendig in
# `make release-artifacts`; Upload/Download zwischen Jobs und der Release-Upload sind
# Workflow-Mechanik, kein Check. Die eine Ausnahme ist der Start-Smoke auf den
# macOS-/Windows-Runnern — dort ist `make` nicht installiert (gemessen), deshalb ruft
# der Step ein repo-eigenes, von shell-lint gedecktes Skript. Der MR-Block traegt die
# Ausnahme samt Grund; eine zweite Definition in dieser YAML entsteht dadurch nicht.
#
# GRENZE, benannt statt verschwiegen (LH-QA-04 Messmethode, CR 0.13.0): auf macOS und
# Windows laeuft ein START-Smoke — das Binary laeuft, meldet seine Usage, Exit 0. Ein
# VOLL-Smoke ist dort nicht erreichbar: die macOS-Runner tragen kein Container-Runtime,
# die Windows-Runner nur Windows-Container. Der Voll-Smoke bleibt Linux-Sache und
# laeuft pro Push in ci.yml.
#
# workflow_dispatch wie in upstream-drift.yml: der Plattform-Nachweis ist damit VOR
# einem Tag manuell anstossbar — sonst kaeme das Feedback erst beim Release.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Ein laufendes Release NICHT abbrechen (anders als ci.yml): ein halb hochgeladenes
# Release ist schlechter als ein doppelter Lauf.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Bauen: EIN Linux-Runner cross-kompiliert alle sechs Binaries im gepinnten Image
  # (Docker-only, ADR-0003). Die Plattform-Runner bauen nichts — sie starten nur.
  artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: mkdir -p dist
      - run: make release-artifacts DEST=dist
      - name: Inventar zeigen (Beleg im Lauf-Log, nicht nur Exit 0)
        run: ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Start-Smoke je Plattform. fail-fast: false — ein Bruch auf einer Plattform soll
  # die Aussage der uebrigen nicht verdecken.
  start-smoke:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bin: ai-harness-init-linux-amd64
          - runner: ubuntu-24.04-arm
            bin: ai-harness-init-linux-arm64
          - runner: macos-26-intel
            bin: ai-harness-init-darwin-amd64
          - runner: macos-26
            bin: ai-harness-init-darwin-arm64
          - runner: windows-2025
            bin: ai-harness-init-windows-amd64.exe
          - runner: windows-11-arm
            bin: ai-harness-init-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      # REIHENFOLGE IST TRAGEND: Checkout ZUERST, Artefakt DANACH. `actions/checkout`
      # raeumt den Workspace per Default auf (clean: true) und loescht dabei alles
      # Ungetrackte — ein vorher heruntergeladenes dist/ waere weg. Genau so ist der
      # erste reale Dispatch-Lauf gescheitert, auf allen sechs Runnern gleich; lokal
      # ist das nicht sichtbar, weil kein Gate den Workflow ausfuehrt.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: dist
      - name: Start-Smoke
        shell: bash
        # Die PRUEFUNG lebt im Repo (harness/tools/start-smoke.sh), nicht in dieser
        # YAML: MR-014 Setzung 1 will EINE Quelle je Check. `make <target>` waere die
        # Regelform, ist hier aber nicht gangbar — make ist auf den Windows- und
        # macOS-Runnern nicht installiert (gemessen). Der MR-Block traegt die Ausnahme.
        run: bash harness/tools/start-smoke.sh "dist/${{ matrix.bin }}"

  # Veroeffentlichen: nur fuer einen echten Tag. Ein workflow_dispatch-Lauf baut und
  # smoked, laedt aber NICHTS hoch — sonst entstuende ein Release ohne Tag.
  publish:
    needs: start-smoke
    # `github.event_name == 'push'` ist NOETIG, nicht redundant: ein
    # workflow_dispatch laesst sich auf einem TAG-Ref starten, und dann waere
    # startsWith(refs/tags/) wahr — der Lauf wuerde veroeffentlichen, obwohl der Kopf
    # dieser Datei zusagt, dass ein Dispatch nichts hochlaedt (Review F-6).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: dist
      - name: Artefakte ans Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO ist PFLICHT: dieser Job checkt bewusst nicht aus (er braucht nur
          # die Artefakte), und `gh` loest sein Basis-Repo sonst aus den git-Remotes
          # des Arbeitsverzeichnisses — ohne Checkout bricht schon `gh release view`
          # mit „kein Git-Repository" ab, bevor ein API-Aufruf stattfindet. Hermetisch
          # gemessen; ohne diese Zeile waere der ganze publish-Pfad ein sicherer
          # Fehlschlag (Review F-1, HIGH).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # `gh release upload` laedt in ein BESTEHENDES Release und legt keines an —
          # bei einem frischen Tag waere das ein sicherer Fehlschlag. Deshalb erst
          # pruefen, dann anlegen ODER ergaenzen.
          #
          # VORAB-TAG (SemVer-Praerelease, z. B. v0.1.0-RC): wird als --prerelease
          # markiert. Das ist die Probe fuer genau den Pfad, der sonst KEINEN Sensor
          # hat — workflow_dispatch baut und smoked, beruehrt den Upload aber nie.
          # Ein RC-Tag durchlaeuft die ganze Kette und ist hinterher loeschbar.
          # SemVer: das Praerelease-Feld steht zwischen Version und dem optionalen
          # Build-Metadatum. Der Metadaten-Teil wird deshalb ZUERST abgeschnitten,
          # sonst gaelte `v1.0.0+build-1` faelschlich als Vorabversion (Review F-7).
          vorab=nein
          case "${tag%%+*}" in *-*) vorab=ja ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif [ "$vorab" = ja ]; then
            gh release create "$tag" dist/* --generate-notes --prerelease
          else
            gh release create "$tag" dist/* --generate-notes
          fi
