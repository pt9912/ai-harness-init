# Doku-Referenz-Gate. Startgerüst-Quelle: `d-check --print-config`.
# Wächst mit den Artefakten: ids/codepaths/matrix erst aktivieren, wenn
# Targets/roots existieren (sonst Config-Fehler / halluzinierter Gate).
scan:
  roots: ["."]
  # .harness/baseline/: committet vendored Baseline (MR-007) — externer,
  # derivativer Inhalt, nicht repo-autoritativ; vom Doc-Gate ausgenommen. Sie
  # trägt kurs-eigene MR-/ADR-Kennungen (Beispiele, nicht die des Repos), die
  # sonst die ids-Link-Pflicht träfen. Glob ohne <tag>: der Tag-String lebt
  # allein in BASELINE_TAG (Makefile).
  # docs/user/claude-hooks-referenz.md: vendored Werkzeug-Doku (Hooks-Referenz),
  # dieselbe Klasse wie die Baseline — externer Inhalt, nicht repo-autoritativ. Sie
  # verlinkt durchgaengig auf /docs/de/...-Pfade der Herstellerseite; gemessen 70
  # target-missing, alle aus dieser Ursache. Sie liegt committet im Repo, damit die
  # Plaene sie NETZLOS zitieren koennen (die Linie aus MR-007) — geprueft wird sie
  # nicht, denn wir schreiben sie nicht.
  # docs/plan/adr/0013-technik-stratum-als-zielort.md: ANDERE Klasse als die drei
  # darueber. Die Datei ist repo-autoritativ und wird trotzdem nicht geprueft — sie
  # traegt einen Markdown-Link in den vendored Baum unter dem Tag, den der Re-Baseline-
  # Tausch abgeloest hat. Der Link meldet target-missing, und AGENTS.md 3.4 sperrt die
  # Reparatur: die ADR steht auf Accepted. Ein Befund, den niemand beheben darf, haelt
  # make gates dauerhaft rot und erzieht dazu, Rot zu ueberlesen (LH-QA-01 eine Ebene
  # tiefer). Der Ausschluss wirkt datei-weit ueber alle fuenf Module, weil links und
  # anchors keine Options-Sektion tragen — der referenz-weite Knopf existiert nicht.
  # GRENZE, keine Regel: der Eintrag ist EXTENSIONAL GESCHLOSSEN auf genau diese eine
  # Datei (ADR-0017). Jeder weitere Eintrag ist eine neue Senkung nach AGENTS.md 3.5
  # und braucht seine eigene ADR — auch dann, wenn er dieselbe Bedingung erfuellt.
  ignore: ["**/*.template.md", ".tmp/**", ".harness/baseline/**", "docs/user/claude-hooks-referenz.md", "docs/plan/adr/0013-technik-stratum-als-zielort.md"]
modules: [links, anchors, ids, matrix, codepaths, spans]
# ignore-refs (referenz-weit, geteilt seit d-check 0.49.0 — links, anchors und codepaths
# honorieren denselben Top-Level-Schluessel): nimmt benannte Referenzen aus, keine Datei.
# in und refs sind je auf einen Dateinamen geschnitten; aus der Pruefung faellt nur, was beide
# gemeinsam treffen. Der Rumpf von MR-021 traegt einen Markdown-Link in den abgeloesten
# Baseline-Baum: der Satz um ihn herum ist nur ueber jenen Stand wahr, die adoptierte Baseline
# sagt an derselben Zeile das Gegenteil, und der Rumpf des Eintrags ist append-only eingefroren.
# Warum daraus eine Ausnahme folgt und keine Reparatur, steht in ADR-0026.
# Der Eintrag laesst die Datei im Pruefbereich — die gepruefte Datei-Zahl bewegt sich durch ihn
# nicht. Wie viele Referenzen ein Paar wirklich stumm schaltet, misst weder diese Config noch
# docs-check: ein zu breiter Eintrag ist genauso gruen wie ein enger. Das misst
# test/ignore-refs-restbreite.bats (in make gates) — mehr als ein Link je Paar faerbt rot.
# GRENZE, keine Regel: EXTENSIONAL GESCHLOSSEN auf dieses eine Paar (ADR-0026). Jeder weitere
# Eintrag, jedes weitere Glob und jede Verbreiterung auf ein Verzeichnis ist eine neue Senkung
# nach AGENTS.md 3.5 und braucht ihre eigene ADR — auch dann, wenn sie dieselbe Bedingung
# erfuellt.
ignore-refs:
  # Quell-Schluessel: der Rumpf von MR-021 liegt seit dem Umzug in seiner eigenen Datei; die
  # ausgenommene Referenz ist dieselbe (ADR-0032 zieht den Schluessel nach und supersedet dafuer
  # die Entscheidung aus ADR-0026 in diesem einen Wert). Das relative Ziel steht eine Ebene
  # tiefer, das aufgeloeste ist unveraendert.
  - in: "harness/conventions/MR-021-das-span-schema-zieht-ins-technik-stratum-sein-eintrag-wird-aufgehoben.md"
    refs: [".harness/baseline/v3.5.2/regelwerk/modul-08-agentenrollen.md"]
  # Zweites Paar, eigene Entscheidung (ADR-0027). docs/plan/adr/0026-eingefrorene-referenz-
  # referenz-weit-ausgenommen.md nennt CO-005 in ihrer Geschichte-Tabelle als Pfad-Link auf den
  # Ort VOR der Aufloesung; der Carveout ist aufgeloest und liegt darum in carveouts/done/, denn
  # Modul 7 der Baseline schreibt diesen Move vor. Die Quelldatei steht auf Accepted und ist nach
  # AGENTS.md 3.4 eingefroren — der Befund ist in ihr nicht behebbar. Warum daraus eine Ausnahme
  # folgt und keine Reparatur, steht in ADR-0027.
  # Die Restbreite dieses Paares ist nicht klein, sondern strukturell null: eine eingefrorene
  # Datei bekommt keine zweite Referenz. Darin unterscheidet es sich vom Paar darueber, dessen
  # Quelldatei lebt. Der Kommentar steht eingerueckt, weil test/ignore-refs-restbreite.bats den
  # Top-Level-Block an der ersten Zeile in Spalte 0 enden laesst.
  # GRENZE, keine Regel: EXTENSIONAL GESCHLOSSEN auf dieses eine zusaetzliche Paar (ADR-0027).
  # Die Grenze des Paares darueber gilt unveraendert weiter; ein drittes Paar ist eine neue
  # Senkung nach AGENTS.md 3.5 und braucht seine eigene ADR — auch dann, wenn es dieselbe
  # Bedingung erfuellt.
  - in: "docs/plan/adr/0026-eingefrorene-referenz-referenz-weit-ausgenommen.md"
    refs: ["docs/plan/carveouts/CO-005-adaptions-block-datierter-beleg.md"]
  # Drittes Paar, eigene Entscheidung (ADR-0030). docs/plan/adr/0018-ziel-fassung-regiert-die-
  # migration.md nennt die Welle-Plan-Datei von welle-10 als Pfad auf den Ort VOR der Closure;
  # die Closure bewegt sie per git mv nach done/, denn Modul 6 der Baseline schreibt diesen Move
  # vor. Die Quelldatei steht auf Accepted und ist nach AGENTS.md 3.4 eingefroren — der Befund ist
  # in ihr nicht behebbar. Warum daraus eine Ausnahme folgt und keine Reparatur, steht in ADR-0030.
  # ANDERE ACHSE als die zwei Paare darueber: die Adresse steht als Inline-Code, der Befund ist
  # codepath-missing statt target-missing. Dass der geteilte Top-Level-Schluessel auch codepaths
  # honoriert, ist an diesem Paar gemessen (ADR-0030, Sonden-Tabelle), nicht angenommen.
  # Die Restbreite dieses Paares ist strukturell null: eine eingefrorene Datei bekommt keine
  # zweite Referenz. Sie ist hier gemessen (ein Code-Span, null Markdown-Links), aber NICHT
  # bewacht: test/ignore-refs-restbreite.bats zaehlt nur die Inline-Markdown-Form und sieht die
  # Code-Span-Achse nicht — es zaehlt fuer dieses Paar null und ist gruen, ohne gemessen zu haben.
  # Das ist ADR-0030 Folgepflicht 2, eine benannte Luecke und keine behauptete Deckung.
  # GRENZE, keine Regel: EXTENSIONAL GESCHLOSSEN auf dieses eine zusaetzliche Paar (ADR-0030).
  # Die Grenzen der zwei Paare darueber gelten unveraendert weiter; ein viertes Paar ist eine neue
  # Senkung nach AGENTS.md 3.5 und braucht seine eigene ADR — auch dann, wenn es dieselbe
  # Bedingung erfuellt. Das gilt namentlich fuer den geladenen zweiten Fall der Klasse, den
  # ADR-0030 im Kontext benennt und ausdruecklich NICHT mitnimmt.
  - in: "docs/plan/adr/0018-ziel-fassung-regiert-die-migration.md"
    refs: ["docs/plan/planning/welle-10-re-baseline.md"]
  # Viertes Paar, eigene Entscheidung (ADR-0034). docs/plan/adr/0028-anweisungssatz-gehoert-der-
  # ausfuehrenden-rolle.md nennt die Register-Datei als Pfad-Link auf den Ort VOR ihrem Wegfall;
  # v6.0.0 ersetzt die Tabellen-Datei durch die Verzeichnis-Ablage observations/, denn Modul 6 der
  # Baseline schreibt diese Form vor. Die Quelldatei steht auf Accepted und ist nach AGENTS.md 3.4
  # eingefroren — der Befund ist in ihr nicht behebbar. Warum daraus eine Ausnahme folgt und keine
  # Reparatur, steht in ADR-0034.
  # ANDERE ACHSE als das dritte Paar darueber: die Adresse steht als Markdown-Link, der Befund ist
  # target-missing wie bei den ersten beiden Paaren. Der Wert von refs ist der AUFGELOESTE Pfad;
  # die geschriebene, relative Form traegt nicht (ADR-0034, Sonden-Tabelle).
  # Die Restbreite dieses Paares ist strukturell null: eine eingefrorene Datei bekommt keine
  # zweite Referenz.
  # GRENZE, keine Regel: EXTENSIONAL GESCHLOSSEN auf dieses eine zusaetzliche Paar (ADR-0034). Die
  # Grenzen der drei Paare darueber gelten unveraendert weiter; ein fuenftes Paar ist eine neue
  # Senkung nach AGENTS.md 3.5 und braucht seine eigene ADR — auch dann, wenn es dieselbe
  # Bedingung erfuellt.
  - in: "docs/plan/adr/0028-anweisungssatz-gehoert-der-ausfuehrenden-rolle.md"
    refs: ["docs/plan/planning/observations.md"]
# Kennungen sind linkpflichtig (auch in Inline-Code, link-policy: always) —
# "klickbar zur Quelle" als gemessenes Property. Literal-schwere Artefakte
# (Review-Reports, CHANGELOG) ausgenommen.
ids:
  patterns:
    - regex: 'ADR-\d{4}'
      target: docs/plan/adr/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'LH-[A-Z]{2}-\d{2}'
      target: spec/lastenheft.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'MR-\d{3}'
      # target = Definitions-Ort ("dort ist die Kennung zu Hause"). Die Rumpf-Dateien des
      # Adaptions-Blocks liegen seit dem Umzug in harness/conventions/, nicht mehr in der
      # Index-Datei; der Ort folgt dem Rumpf (MR-045 Setzung 2). KEINE Senkung: jedes Byte,
      # das hier ausgenommen ist, lag vorher in der Index-Datei und war dort ebenso
      # ausgenommen — und harness/conventions.md tritt dadurch NEU unter die Link-Pflicht.
      # Der Ort steuert nur, wo eine blanke Kennung erlaubt ist; die 2000+ Verweise des Repos
      # zeigen unveraendert auf harness/conventions.md#mr-NNN--<slug> und werden von links/
      # anchors geprueft, nicht von hier.
      target: harness/conventions/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
# Referenz-Richtung (SDP) mechanisch: Spec-Straten verweisen nie abwärts
# auf ADRs/Slices; Verweise auf superseded/deprecated ADRs verboten.
# Provenance nur in den Historie-/Geschichte-Tabellen (ausgenommen).
matrix:
  classes:
    - {name: spec-straten, paths: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]}
    - {name: adr, paths: ["docs/plan/adr/[0-9]*.md"]}
    - {name: slice, paths: ["docs/plan/planning/**/slice-*.md"]}
  rules:
    - {from: spec-straten, to: adr, allow: false}
    - {from: spec-straten, to: slice, allow: false}
  status: {forbidden: [superseded, deprecated]}
  exclude-sections: [Historie, "7. Historie", Geschichte]
codepaths:
  roots: [spec, docs, harness]                                  # tools/cmd/internal folgen mit dem Go-Code (Phase 3); Harness-Tools liegen unter harness/tools/ (MR-005)
  # check-lines (seit d-check v0.50.0): verifiziert die Zeilen-Referenz eines Inline-Code-Pfads
  # `datei:<von>-<bis>` (Existenz + `bis <= Zeilenzahl` + `von <= bis`). ADDITIVE Härtung am
  # bereits aktiven codepaths (nicht-leerer Prüfbereich) — KEIN eigenständiges Gate, kein neuer
  # Gate-Name (LH-QA-01). Trockenlauf grün über dem realen Korpus (slice-015 / MR-011). Das
  # verbatim-Modul citations bleibt opt-out (0 d-check:cite-Direktiven -> nie feuerndes Gate).
  check-lines: true
  # exempt-paths (datei-weit): Zeitdokumente docs/reviews/** frieren den Stand ihres
  # Review-Laufs ein; Lifecycle-Pfade (next/->in-progress/->done/) darin veralten per
  # Definition. Ersetzt die verstreuten Zeilen-Marker (slice-016 / MR-009).
  exempt-paths: ["docs/reviews/**"]
  # ignore-refs (referenz-weit): Tombstones bewusst ENTFERNTER Artefakte (MR-008/MR-009 —
  # entfernt, nicht geplant; ein geplanter Pfad bleibt Doc-fuehrt-Code-folgt und ist kein
  # Tombstone). Normative Doku darf die klaren vollen Pfade nennen statt Glob-Workarounds.
  # Genau die geloeschten Dateien, keine breite Liste. MR-009 ist PERMANENT; seine
  # Wachstums-Klausel ist eine Bedingung an diese Liste, kein Aufloesungs-Trigger: sie waechst
  # nur mit weiteren bewusst entfernten Artefakten.
  # Die ersten fuenf sind die Repo-Kopien der Ausfuell-Templates, deren einzige Quelle heute
  # die vendored Baseline ist (MR-008).
  # Der sechste ist der Shell-Helfer der Wellen-Archivierung: die Operation liegt als
  # Unterkommando des Produkt-Binaers in internal/archive (ADR-0033 Festlegung 1 und 2), zwei
  # Fassungen nebeneinander gibt es nicht. Die Zeitdokumente in docs/plan/planning/done/ und
  # das Beobachtungs-Register nennen den Pfad als Inline-Code weiter — dort ist er die Adresse
  # eines Vorgangs, den es gab.
  # Der siebte ist die flache Register-Datei selbst (ADR-0034): v6.0.0 ersetzt sie ersatzlos
  # durch die Verzeichnis-Ablage docs/plan/planning/observations/, keine zweite Fassung bleibt
  # stehen. Referenz-weit wie die sechs Paare darueber: jede Inline-Code-Nennung dieses Pfads
  # verstummt, unabhaengig von der Quelldatei. Gemessen (Eintrag entfernt, docs-check ueber der
  # Kopie) reicht das ueber die zwei im Ursprungs-Slice genannten Klassen (docs/plan/planning/
  # done/, docs/reviews/) hinaus auf vier Klassen: docs/plan/planning/done/** (Zeitdokumente,
  # Adresse eines Vorgangs, den es gab) · docs/plan/planning/open/** (slice-151/152/153/162/168/
  # 171/174/181/184 -- neun Dateien, die alte Vorlagen-Zeile "Beobachtungs-Register
  # (`../observations.md`) fortgeschrieben", Form-Nachzug ist slice-184s eigener Gegenstand,
  # nicht dieser Zeile -- slice-184 traegt die Zeile selbst UND ist in dieser Liste, weil sein
  # eigener Plan sie ebenfalls zitiert) ·
  # docs/plan/planning/in-progress/slice-177-*.md selbst (misst den Ausgangsstand vor dem eigenen
  # Umzug, Praeteritum) · docs/user/benutzerhandbuch.md (eine datierte Aenderungshistorie-Zeile,
  # Chronik von Beruf). Kein Treffer liegt ausserhalb dieser vier Klassen -- namentlich kein
  # .claude/commands/* oder internal/emit/templates/commands/* mehr, die vor diesem Nachzug hier
  # mitverdeckt waren.
  ignore-refs:
    - docs/plan/planning/slice.template.md
    - docs/plan/planning/welle.template.md
    - docs/plan/adr/NNNN-titel.template.md
    - docs/plan/carveouts/carveout.template.md
    - docs/reviews/review-report.template.md
    - harness/tools/archive-welle.sh
    - docs/plan/planning/observations.md
# sources (opt-in, NETZ, seit d-check v0.51.0): Content-Pin des Baseline-Assets gegen
# Upstream-Drift (MR-013) — der tool-gelieferte Ersatz fuer den Eigenbau (curl+sha256sum)
# im Target `make regelwerk-check`. BEWUSST NICHT in `modules:` oben: sources ist Netz und
# wuerde den netzlosen `docs-check`/`make gates` brechen (LH-QA-01); aktiviert nur via
# `make regelwerk-check` (--enable sources). unpack: none = Roh-Byte-Hash = das kanonische
# Makefile-BASELINE_ZIP_SHA256 (MR-007; gemessen 0 Drift). test/sources-pin.bats koppelt beide
# fail-closed (in gates) — Re-Baseline muss beide Pins bewegen.
sources:
  - url: https://github.com/pt9912/ai-harness-course/releases/download/v6.0.0/lab-regelwerk.zip
    sha256: ed617e382560793ddd805650a7a0e1e421d68d4fff81253da240a9d47a2e654a
    unpack: none
